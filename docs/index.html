<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng theo dõi thị trường</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c232c;--line:#2a323d;--text:#e6edf3;--mute:#8b96a3;
  --up:#22c55e;--down:#ef4444;--ref:#eab308;--ceil:#c084fc;--floor:#22d3ee;--acc:#60a5fa;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-family:inherit;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:12px 12px 84px}
.banner{background:#3b2f0a;color:#fde68a;border:1px solid #6b5412;border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:12px}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header.top h1{font-size:17px;margin:0;font-weight:700;flex:1}
.search{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text);width:130px;font:inherit;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h2 .sub{color:var(--mute);font-weight:400;font-size:12px;margin-left:auto}
.up{color:var(--up)}.down{color:var(--down)}.ref{color:var(--ref)}.mute{color:var(--mute)}
.badge{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.b-ok{background:#0f2e1c;color:#86efac;border-color:#1f5c37}
.b-warn{background:#3a2a0c;color:#fcd34d;border-color:#6b4f12}
.b-ai{background:#1a2440;color:#93c5fd;border-color:#2c3f6e}
.b-hi{background:#3a1020;color:#fda4af;border-color:#6b1f33}
.b-md{background:#2a2410;color:#fde68a;border-color:#5a4c18}
.b-lo{background:#1f2630;color:#9aa6b2}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:820px){.grid2{grid-template-columns:1.2fr 1fr}}
.grid2>*{min-width:0}
.index-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.idx{background:var(--panel2);border-radius:10px;padding:10px 12px;min-width:120px}
.idx .n{color:var(--mute);font-size:12px}.idx .v{font-size:17px;font-weight:600;margin-top:2px}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.tile{border-radius:10px;padding:10px 8px;cursor:pointer;min-height:64px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .1s}
.tile:active{transform:scale(.97)}
.tile .t{font-size:12px;font-weight:600}.tile .p{font-size:15px;font-weight:600}
.list .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.list .row:first-child{border-top:none}
.tk{font-weight:700;font-size:15px;min-width:46px}
.row .mid{flex:1;min-width:0}.row .mid .s{color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:#1a2440;color:#93c5fd}
.report p{margin:0 0 8px;line-height:1.55}
.report .line{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;line-height:1.5}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;color:var(--mute);font:inherit}
.tab.on{background:var(--acc);color:#0b1220;border-color:var(--acc);font-weight:600}
.tblwrap{overflow-x:auto;margin:0 -14px;padding:0 14px}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:11.5px;position:sticky;top:0;background:var(--panel)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--panel2)}
.hero{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.hero .px{font-size:30px;font-weight:700;line-height:1}
.hero .meta{color:var(--mute);font-size:12px}
.back{color:var(--acc);cursor:pointer;font-size:13px;margin-bottom:8px;display:inline-block}
.ratios{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ratio{background:var(--panel2);border-radius:10px;padding:9px 10px;cursor:pointer;position:relative}
.ratio .k{color:var(--mute);font-size:11.5px;display:flex;justify-content:space-between;gap:4px}
.ratio .v{font-size:16px;font-weight:600;margin-top:3px}
.ratio .h{font-size:11px;margin-top:2px}
.grp{font-size:12px;color:var(--mute);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.grp:first-child{margin-top:0}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar .col{width:100%;border-radius:5px 5px 0 0;min-height:2px}
.bar .lb{font-size:10px;color:var(--mute)}.bar .vl{font-size:10px}
#chart{height:340px;margin:0 -6px}
.sig{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.news .it{padding:10px 0;border-top:1px solid var(--line)}
.news .it:first-child{border-top:none}
.news .it .hd{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.news .it a.ti{display:block;color:var(--text)}
.news .it .ti{font-weight:600;line-height:1.4}
.news .it .sm{color:var(--mute);font-size:12.5px;line-height:1.5;margin-top:3px}
.view{display:grid;gap:10px}
@media(min-width:820px){.view{grid-template-columns:1fr 1fr}}
.vcard{background:var(--panel2);border-radius:12px;padding:12px}
.vcard .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.vcard .hd b{flex:1}
.vcard p{margin:0;line-height:1.55;color:#cbd5e1}
.trend{font-weight:700}
nav.bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;background:rgba(13,17,23,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav.bottom button{background:none;border:none;color:var(--mute);font:inherit;font-size:12px;padding:6px 18px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom button.on{color:var(--text);background:var(--panel)}
nav.bottom svg{width:20px;height:20px}
.tip{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);max-width:min(520px,92vw);background:#0b1220;border:1px solid var(--acc);border-radius:12px;padding:12px 14px;z-index:50;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5);line-height:1.5}
.tip b{display:block;margin-bottom:4px}
.tip .f{font-size:12px;color:#93c5fd;margin-bottom:4px}
.secsel{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.pipe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--mute)}
.pipe span.n{background:var(--panel2);border-radius:6px;padding:3px 7px;color:var(--text)}
.foot{color:var(--mute);font-size:11.5px;text-align:center;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">⚠️ <b>Bản mẫu giao diện</b> — mọi con số, tin tức và nhận định dưới đây là <b>dữ liệu giả</b> để duyệt bố cục, không phải số liệu thật.</div>
  <header class="top">
    <h1 id="ttl">Thị trường hôm nay</h1>
    <input class="search" id="q" placeholder="Tìm mã…" maxlength="4" autocomplete="off">
  </header>
  <main id="app"></main>
  <div class="foot">Luồng: dữ liệu giao dịch + BCTC → code tính chỉ số → Claude viết → Claude kiểm chứng<br>Không phải khuyến nghị đầu tư.</div>
</div>
<div class="tip" id="tip"></div>
<nav class="bottom">
  <button data-go="tong-quan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg>Tổng quan</button>
  <button data-go="nganh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Ngành</button>
  <button data-go="ma"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Mã</button>
</nav>

<script>
const SECTORS=[
 ["bank","Ngân hàng",["VCB","BID","CTG","MBB","TCB","VPB","ACB","HDB","STB","VIB"]],
 ["bds","Bất động sản",["VHM","VIC","NVL","KDH","NLG","DXG","PDR","HDG","KBC","SZC"]],
 ["chung-khoan","Chứng khoán",["SSI","VND","VCI","HCM","FTS","BSI","CTS","VIX","SHS","MBS"]],
 ["thep","Thép",["HPG","HSG","NKG","TLH","SMC","POM","VGS","TVN","HMC","TIS"]],
 ["cong-nghe","Công nghệ",["FPT","CMG","CTR","VGI","FOX","ELC","ITD","SAM","ST8","TTN"]],
 ["ban-le","Bán lẻ",["MWG","FRT","DGW","PNJ","PET","HAX","CTF","SVC","AST","VRE"]],
 ["fnb","F&B",["VNM","MSN","MCH","QNS","SAB","KDC","SBT","DBC","BAF","MML"]],
 ["dau-khi","Dầu khí",["GAS","PLX","PVS","PVD","BSR","OIL","PVT","PVC","PVB","CNG"]],
 ["dien","Điện",["POW","REE","GEG","PC1","NT2","QTP","GEX","VSH","TV2","HND"]],
 ["hoa-chat","Hóa chất",["DGC","DCM","DPM","CSV","LAS","BFC","DDV","PLC","HVT","SFG"]],
 ["vlxd","Vật liệu xây dựng",["BMP","NTP","VCS","HT1","PTB","VGC","DHA","KSB","BTS","CVT"]],
 ["xay-dung","Xây dựng",["CTD","HBC","VCG","FCN","CII","HHV","LCG","C4G","HDC","DPG"]],
 ["duoc","Dược",["DHG","IMP","DBD","DHT","TRA","DMC","DCL","OPC","DVN","JVC"]],
 ["hang-khong","Hàng không",["HVN","VJC","ACV","SCS","NCT","SAS","SGN","MAS","ARM","NAS"]],
 ["thuy-san","Thủy sản",["VHC","ANV","IDI","FMC","MPC","ACL","CMX","ABT","AAM","ASM"]],
 ["logistic","Logistics",["GMD","HAH","VSC","VTP","PHP","SGP","TMS","DVP","VOS","STG"]],
 ["cao-su","Cao su",["GVR","PHR","DPR","DRI","TRC","TNC","HRC","DRC","CSM","SRC"]],
 ["det-may","Dệt may",["TCM","TNG","MSH","VGT","STK","GIL","PPH","ADS","EVE","M10"]],
 ["khoang-san","Khoáng sản",["KSV","MSR","BMC","HGM","MVB","TC6","THT","TDN","NBC","TVD"]],
];
const DEF={
 tthh:["Tỷ số thanh toán hiện hành","Tài sản ngắn hạn / Nợ ngắn hạn","Khả năng trả nợ ngắn hạn. Thường nên ≥ 1."],
 ttn:["Tỷ số thanh toán nhanh","(TSNH − Hàng tồn kho) / Nợ ngắn hạn","Như thanh toán hiện hành nhưng loại hàng tồn kho — tài sản kém thanh khoản nhất."],
 ttm:["Tỷ số tiền mặt","Tiền mặt / Nợ ngắn hạn","Nhà cho vay ngắn hạn rất quan tâm chỉ số này."],
 debt:["Nợ / Vốn chủ sở hữu","Tổng nợ / VCSH","Mức dùng đòn bẩy. Càng cao càng rủi ro khi lãi suất tăng."],
 totdebt:["Tỷ số tổng nợ","(Tổng TS − VCSH) / Tổng TS","Tỷ lệ tài sản được tài trợ bằng nợ."],
 icr:["Khả năng thanh toán lãi vay","EBIT / Lãi vay","Đo mức đảm bảo chi trả lãi vay."],
 vqhtk:["Vòng quay hàng tồn kho","Giá vốn hàng bán / HTK","Càng cao càng hiệu quả."],
 vqpt:["Vòng quay khoản phải thu","Doanh thu / Khoản phải thu","Thu tiền bán hàng nhanh hay chậm. Càng cao càng tốt."],
 vqtts:["Vòng quay tổng tài sản","Doanh thu / Tổng tài sản","Mỗi đồng tài sản tạo ra bao nhiêu đồng doanh thu."],
 blng:["Biên lợi nhuận gộp","Lợi nhuận gộp / Doanh thu","Sức mạnh định giá sản phẩm."],
 blnr:["Biên lợi nhuận ròng","Lợi nhuận ròng / Doanh thu","Khả năng sinh lời cuối cùng. Càng cao càng tốt."],
 ebitda:["Biên EBITDA","EBITDA / Doanh thu","Dòng tiền hoạt động trước thuế, lãi vay, khấu hao."],
 roa:["ROA","LNR / Tổng tài sản","Lợi nhuận trên mỗi đồng tài sản."],
 roe:["ROE","LNR / VCSH","Hiệu quả cuối cùng mang lại cho cổ đông."],
 eps:["EPS","LNR / Số CP lưu hành","Tăng trưởng qua các kỳ → doanh nghiệp tăng trưởng."],
 pe:["P/E","Giá / EPS","Nhà đầu tư trả bao nhiêu cho 1 đồng lợi nhuận. P/E cao thường hàm ý kỳ vọng tăng trưởng."],
 bvps:["Giá trị sổ sách / CP","VCSH / Số CP lưu hành","Con số kế toán, phản ánh chi phí lịch sử."],
 pb:["P/B","Giá / Giá trị sổ sách","P/B < 1 có thể nghĩa là DN chưa tạo giá trị cho cổ đông."],
 cap:["Vốn hóa","Giá × Số CP lưu hành","Cần bao nhiêu tiền để mua toàn bộ cổ phiếu."],
 evebitda:["EV / EBITDA","(Vốn hóa + Nợ vay − Tiền) / EBITDA","So sánh DN khác cấu trúc vốn. Cao → kỳ vọng tăng trưởng."],
 tochuc:["Sở hữu tổ chức","% CP do tổ chức nắm","Tổ chức nắm nhiều → cổ phiếu được 'đỡ' tốt hơn."],
 nn:["Sở hữu nước ngoài","% CP do NĐT nước ngoài nắm",""],
 nim:["NIM – Biên lãi thuần","Thu nhập lãi thuần / TS sinh lãi","Ngân hàng: càng cao càng sinh lời."],
 npl:["NPL – Nợ xấu","Nợ nhóm 3–5 / Tổng dư nợ","< 2% là tốt."],
 llr:["LLR – Bao phủ nợ xấu","Dự phòng / Nợ xấu","100% an toàn, 150% rất khỏe."],
 ldr:["LDR – Cho vay / Huy động","Dư nợ / Tiền gửi","Khỏe: 80–90%."],
 car:["CAR – An toàn vốn","Vốn tự có / TS có rủi ro","> 8%; cao thì còn dư địa tăng trưởng."],
 casa:["CASA","Tiền gửi không kỳ hạn / Tổng tiền gửi","Cao → chi phí vốn rẻ."],
};
// ===================== TIỆN ÍCH =====================
const $=s=>document.querySelector(s);
const fmt=n=>n==null?"—":Number(n).toLocaleString("vi-VN");
const num=(v,d=2)=>v==null||isNaN(v)?"—":(Math.abs(v)>=1000?fmt(Math.round(v)):(+v).toFixed(d).replace(/\.?0+$/,""));
const pc=n=>n==null?'<span class="mute">—</span>':`<span class="num ${n>0?"up":n<0?"down":"ref"}">${n>0?"+":""}${(+n).toFixed(2)}%</span>`;
const cls=n=>n>0?"up":n<0?"down":"ref";
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function heatColor(c){const a=Math.min(1,Math.abs(c)/3.5);return c>=0?`rgba(34,197,94,${.15+a*.6})`:`rgba(239,68,68,${.15+a*.6})`}
function rng(seed){let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%100000)/100000}}
function go(h){location.hash=h}
const badge=st=>st==="ok"?'<span class="badge b-ok">✅ Đã kiểm chứng</span>':'<span class="badge b-warn">⚠️ Cần xem lại</span>';
const LOWER_BETTER=new Set(["debt","totdebt","pe","pb","evebitda","npl"]);
let D=null,chartObj=null,stockTab="tai-chinh";const CANDLES={};

// ===================== DỮ LIỆU MẪU (khi chưa có data.json) =====================
function sampleData(){
  const stocks={},sectors=[];const now=new Date();
  const qs=[];for(let i=0;i<12;i++){const y=24+Math.floor(i/4);qs.push(`Q${i%4+1}/${y}`)}
  const SIG={rsi_up30:"RSI vượt lên khỏi vùng quá bán (30)",ma50_up_vol:"Giá cắt lên MA50 kèm khối lượng ≥ 1,5× TB20",macd_up:"MACD cắt lên đường tín hiệu",high52:"Giá lập đỉnh 52 tuần",rsi_down70:"RSI rời vùng quá mua (70)"};
  SECTORS.forEach(([id,name,tks])=>{
    const bias=(rng("sec"+id)()-.5)*3.2;
    tks.forEach((tk,i)=>{const r=rng(tk);const px=Math.round((8+r()*120)*100)*10;const eps=Math.round(500+r()*7000);
      const s={tk,sec:id,secName:name,px,chg:+(bias+(r()-.5)*5).toFixed(2),vol:Math.round((0.3+r()*12)*1e6),volx:+(0.4+r()*2.6).toFixed(2),
        cap:Math.max(3,Math.round((420-i*40)*(0.25+r()*.9))),eps,pe:+(px/eps).toFixed(1),pb:+(0.7+r()*3.2).toFixed(2),bvps:Math.round(8000+r()*40000),
        roe:+(6+r()*22).toFixed(1),roa:+(1+r()*12).toFixed(1),blng:+(8+r()*40).toFixed(1),blnr:+(2+r()*25).toFixed(1),ebitda:+(5+r()*30).toFixed(1),
        tthh:+(0.8+r()*3).toFixed(2),ttn:+(0.4+r()*2.4).toFixed(2),ttm:+(0.05+r()*.8).toFixed(2),debt:+(0.1+r()*2).toFixed(2),icr:+(2+r()*25).toFixed(1),
        vqhtk:+(2+r()*10).toFixed(1),vqpt:+(3+r()*12).toFixed(1),vqtts:+(0.3+r()*1.5).toFixed(2),evebitda:+(4+r()*14).toFixed(1),
        nim:+(2.5+r()*3).toFixed(2),npl:+(0.6+r()*2.4).toFixed(2),llr:Math.round(60+r()*180),ldr:Math.round(70+r()*20),car:+(9+r()*5).toFixed(1),casa:Math.round(10+r()*30),
        revenue:Math.round(500+r()*30000),profit:Math.round(50+r()*4000),dayDinh:Math.round(20+r()*250),dieuChinh:-Math.round(8+r()*40),quarters:qs,hist:{},news:[],data_warnings:[]};
      ["eps","pe","pb","bvps","roe","roa","blng","blnr","ebitda","tthh","ttn","ttm","debt","icr","vqhtk","vqpt","vqtts","evebitda","cap","nim","npl","llr","ldr","car","casa","revenue","profit"].forEach(k=>{
        const rr=rng(tk+k);const a=[+s[k]];for(let j=0;j<11;j++)a.unshift(+(a[0]*(1+(rr()-.5)*.18)).toFixed(2));s.hist[k]=a});
      const rsi=Math.round(25+r()*55);

async function getCandles(s){
  if(CANDLES[s.tk])return CANDLES[s.tk];
  if(!D.sample){try{const r=await fetch(`c/${s.tk}.json`);if(r.ok)return CANDLES[s.tk]=(await r.json()).map(a=>({time:a[0],open:a[1],high:a[2],low:a[3],close:a[4],value:a[5]}))}catch(e){}}
  const r=rng(s.tk+"px");let p=s.px*.78;const out=[];const d=new Date();d.setDate(d.getDate()-240);
  while(out.length<170){d.setDate(d.getDate()+1);if(d.getDay()%6===0)continue;const o=p,c=Math.max(1000,o*(1+(r()-.48)*.045));
    out.push({time:d.toISOString().slice(0,10),open:o,high:Math.max(o,c)*(1+r()*.015),low:Math.min(o,c)*(1-r()*.015),close:c,value:s.vol*(0.4+r()*1.4)});p=c}
  const k=s.px/out[out.length-1].close;out.forEach(x=>{x.open*=k;x.high*=k;x.low*=k;x.close*=k});return CANDLES[s.tk]=out;
}

async function drawChart(s){
  const el=$("#chart");if(!el||!window.LightweightCharts)return;const data=await getCandles(s);if(!$("#chart"))return;
  if(chartObj){chartObj.remove();chartObj=null}
  const c=LightweightCharts.createChart(el,{layout:{background:{color:"transparent"},textColor:"#8b96a3",fontFamily:"Be Vietnam Pro"},grid:{vertLines:{color:"#1f2630"},horzLines:{color:"#1f2630"}},rightPriceScale:{borderColor:"#2a323d"},timeScale:{borderColor:"#2a323d"},autoSize:true});
  c.addCandlestickSeries({priceFormat:{type:"price",precision:0,minMove:10},upColor:"#22c55e",downColor:"#ef4444",borderVisible:false,wickUpColor:"#22c55e",wickDownColor:"#ef4444"}).setData(data.map(({time,open,high,low,close})=>({time,open,high,low,close})));
  const v=c.addHistogramSeries({priceScaleId:"",priceFormat:{type:"volume"}});v.priceScale().applyOptions({scaleMargins:{top:.8,bottom:0}});
  v.setData(data.map(x=>({time:x.time,value:x.value,color:x.close>=x.open?"rgba(34,197,94,.35)":"rgba(239,68,68,.35)"})));
  c.addLineSeries({color:"#60a5fa",lineWidth:1.5,priceLineVisible:false,lastValueVisible:false}).setData(ma(data,20));
  c.addLineSeries({color:"#f59e0b",lineWidth:1.5,priceLineVisible:false,lastValueVisible:false}).setData(ma(data,50));
  c.timeScale().fitContent();chartObj=c;
}
function sigText(g,tk){if(!g.count)return `Chưa đủ dữ liệu lịch sử để thống kê ở ${tk}.`;
  return `Xuất hiện ${g.count} lần trong quá khứ · <b class="${g.win_rate>=50?"up":"down"}">${g.win_rate}%</b> số lần giá cao hơn sau ${g.horizon} phiên · TB <span class="${cls(g.avg_return)}">${g.avg_return>0?"+":""}${g.avg_return}%</span>`}
function tabTech(s){
  setTimeout(()=>drawChart(s),0);const t=s.tech||{};const sig=Object.values(s.signals||{});const act=sig.filter(g=>g.active_today),rest=sig.filter(g=>!g.active_today);
  return `<div class="card"><h2>🕯️ Biểu đồ giá <span class="sub">MA20 <span style="color:#60a5fa">━</span> MA50 <span style="color:#f59e0b">━</span></span></h2><div id="chart"></div></div>
  <div class="card"><h2>📐 Chỉ báo hôm nay <span class="badge b-ai">Code tính</span></h2><div class="sig">
    <div class="ratio"><div class="k">RSI(14)</div><div class="v num">${num(t.rsi,1)}</div><div class="h ${t.rsi>70?"down":t.rsi<30?"up":"mute"}">${esc(t.rsi_state)}</div></div>
    <div class="ratio"><div class="k">MACD</div><div class="v ${/lên|Trên/.test(t.macd)?"up":"down"}" style="font-size:14px">${esc(t.macd)}</div></div>
    <div class="ratio"><div class="k">Giá vs MA20 / MA50</div><div class="v" style="font-size:14px"><span class="${t.above_ma20?"up":"down"}">${t.above_ma20?"Trên":"Dưới"}</span> / <span class="${t.above_ma50?"up":"down"}">${t.above_ma50?"Trên":"Dưới"}</span></div></div>
    <div class="ratio"><div class="k">Khối lượng</div><div class="v num">${num(t.volx)}×</div><div class="h mute">so với TB20</div></div>
    <div class="ratio"><div class="k">Hỗ trợ gần</div><div class="v num up">${fmt(t.support)}</div></div>
    <div class="ratio"><div class="k">Kháng cự gần</div><div class="v num down">${fmt(t.resistance)}</div></div></div></div>
  <div class="card news"><h2>🧪 Tín hiệu & tỷ lệ đúng lịch sử <span class="sub">backtest trên chính mã này</span></h2>
    ${act.length?`<div class="grp">Đang xuất hiện hôm nay</div>`+act.map(g=>`<div class="it"><div class="ti">🔔 ${esc(g.label)}</div><div class="sm">${sigText(g,s.tk)}</div></div>`).join(""):`<div class="mute" style="padding:4px 0 8px">Hôm nay không có tín hiệu mới.</div>`}
    <div class="grp">Các tín hiệu khác</div>${rest.map(g=>`<div class="it"><div class="ti" style="font-weight:500">${esc(g.label)}</div><div class="sm">${sigText(g,s.tk)}</div></div>`).join("")}
    <div class="mute" style="font-size:11px;margin-top:8px">Thống kê quá khứ, không đảm bảo tương lai. Không phải khuyến nghị đầu tư.</div></div>`;
}
function tabNews(s){return `<div class="card news"><h2>📰 Tin tức ${s.tk}</h2>${newsList(s.news,s.tk)}</div>`}
function tabView(s){
  const v=s.view;if(!v)return `<div class="card mute">Nhận định cho ${s.tk} được cập nhật hằng tuần (mã nổi bật: hằng ngày). Chưa có nhận định.</div>`;
  const B=[["today","Thị trường hôm nay","Phiên này"],["short","Ngắn hạn","1–4 tuần"],["mid","Trung hạn","1–6 tháng"],["long","Dài hạn","1 năm trở lên"]];
  return `<div class="view">${B.map(([k,t,h])=>{const x=v[k]||{};return `<div class="vcard"><div class="hd"><b>${t}</b><span class="mute" style="font-size:11.5px">${h}</span></div>
   <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><span class="trend ${x.trend==="Tích cực"?"up":x.trend==="Tiêu cực"?"down":"ref"}">${esc(x.trend||"")}</span>${badge(x.status)}</div>
   <p>${esc(x.text||"")}</p>${x.status!=="ok"&&x.note?`<p class="mute" style="font-size:12px;margin-top:4px">↳ ${esc(x.note)}</p>`:""}</div>`}).join("")}</div>
   <div class="mute" style="font-size:11.5px;margin-top:10px">Cập nhật ${esc(s.view_date||"")}. Claude viết, một model Claude khác đối chiếu với số liệu. Không phải khuyến nghị đầu tư.</div>`;
}

// ===================== ĐIỀU HƯỚNG =====================
function render(){
  if(!D)return;const h=(location.hash||"#tong-quan").slice(1);let html,nav="tong-quan";
  if(h.startsWith("nganh-")){html=viewSector(h.slice(6));nav="nganh"}else if(h==="nganh"){html=viewSector(D.sectors[0].id);nav="nganh"}
  else if(h.startsWith("ma-")){html=viewStock(h.slice(3).toUpperCase());nav="ma"}else if(h==="ma"){html=viewStock(D.top[0]);nav="ma"}else html=viewHome();
  if(chartObj){chartObj.remove();chartObj=null}
  $("#app").innerHTML=html;document.querySelectorAll("nav.bottom button").forEach(b=>b.classList.toggle("on",b.dataset.go===nav));
}
document.querySelectorAll("nav.bottom button").forEach(b=>b.onclick=()=>go(b.dataset.go));
window.addEventListener("hashchange",()=>{window.scrollTo(0,0);render()});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){const t=e.target.value.trim().toUpperCase();if(D&&D.stocks[t]){stockTab="tai-chinh";go("ma-"+t);e.target.value=""}else{e.target.style.borderColor="var(--down)";setTimeout(()=>e.target.style.borderColor="",900)}}});
(async()=>{try{const r=await fetch("data.json",{cache:"no-store"});if(r.ok)D=await r.json()}catch(e){}
  if(!D)D=sampleData();
  $(".banner").innerHTML=D.sample?"⚠️ <b>Bản mẫu</b>: chưa kết nối dữ liệu, mọi số liệu dưới đây là giả lập.":D.mock?"🧪 Đang chạy chế độ thử (MOCK): số liệu giả lập.":`🟢 Dữ liệu cập nhật lúc <b>${esc(D.updated)}</b>. Thông tin tham khảo, không phải khuyến nghị đầu tư.`;
  if(!D.sample&&!D.mock)$(".banner").style.cssText="background:#0f2e1c;color:#86efac;border-color:#1f5c37";
  render()})();

</script>
